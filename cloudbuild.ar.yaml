steps:
  # Build the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-f'
      - Dockerfile.dockerhub
      - '-t'
      - 'us-central1-docker.pkg.dev/project-b882ddad-b8b1-4a5c-908/runpod/comfy-worker:latest'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'us-central1-docker.pkg.dev/project-b882ddad-b8b1-4a5c-908/runpod/comfy-worker:latest'

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 300
  logging: CLOUD_LOGGING_ONLY

timeout: 21600s
