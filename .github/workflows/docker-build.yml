name: Build and Push Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile.github'
      - 'handler.py'
      - 'requirements.txt'
      - 'src/**'
      - 'scripts/**'
  workflow_dispatch:

env:
  IMAGE_NAME: fswillis99/runpod-comfy-worker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize disk space
        # Root partition has ~29 GB free; /mnt has ~73 GB free.
        # Move Docker's data root to /mnt so the build can use the full disk.
        run: |
          sudo systemctl stop docker
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/.ghcup /opt/hostedtoolcache
          sudo apt-get clean
          sudo mv /var/lib/docker /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=50000000

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.github
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
