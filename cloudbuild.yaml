steps:
  # Login to Docker Hub
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - echo "$$DOCKERHUB_TOKEN" | docker login -u "$$DOCKERHUB_USERNAME" --password-stdin
    env:
      - 'DOCKERHUB_USERNAME=${_DOCKERHUB_USERNAME}'
      - 'DOCKERHUB_TOKEN=${_DOCKERHUB_TOKEN}'

  # Build the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-f'
      - Dockerfile.dockerhub
      - '-t'
      - '${_IMAGE_NAME}:latest'
      - '-t'
      - '${_IMAGE_NAME}:$COMMIT_SHA'
      - '.'

  # Push
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_NAME}:latest']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_NAME}:$COMMIT_SHA']

substitutions:
  _IMAGE_NAME: fswillis99/runpod-comfy-worker
  _DOCKERHUB_USERNAME: fswillis99
  _DOCKERHUB_TOKEN: placeholder  # override at submit time or in trigger

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 300
  logging: CLOUD_LOGGING_ONLY

timeout: 21600s
