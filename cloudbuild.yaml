steps:
  # Login to Docker Hub using credentials from Secret Manager
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - echo "$$DOCKERHUB_TOKEN" | docker login -u "$$DOCKERHUB_USERNAME" --password-stdin
    secretEnv:
      - DOCKERHUB_USERNAME
      - DOCKERHUB_TOKEN

  # Generate datetime tag (YYYYMMDD-HHMM) and write to /workspace/tag.txt
  - name: 'bash'
    args:
      - '-c'
      - date -u +%Y%m%d-%H%M | tee /workspace/tag.txt

  # Build the image with both :latest and :YYYYMMDD-HHMM tags
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TAG=$$(cat /workspace/tag.txt)
        docker build \
          -f Dockerfile.dockerhub \
          -t fswillis99/runpod-comfy-worker:latest \
          -t fswillis99/runpod-comfy-worker:$${TAG} \
          .

  # Push both tags to Docker Hub
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TAG=$$(cat /workspace/tag.txt)
        docker push fswillis99/runpod-comfy-worker:latest
        docker push fswillis99/runpod-comfy-worker:$${TAG}

availableSecrets:
  secretManager:
    - versionName: projects/project-b882ddad-b8b1-4a5c-908/secrets/dockerhub-username/versions/latest
      env: DOCKERHUB_USERNAME
    - versionName: projects/project-b882ddad-b8b1-4a5c-908/secrets/dockerhub-token/versions/latest
      env: DOCKERHUB_TOKEN

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 300
  logging: CLOUD_LOGGING_ONLY

timeout: 21600s
