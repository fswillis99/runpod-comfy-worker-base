steps:
  # Login to Docker Hub using the stored token
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "$$DOCKERHUB_TOKEN" | docker login -u "$$DOCKERHUB_USERNAME" --password-stdin
    secretEnv:
      - DOCKERHUB_USERNAME
      - DOCKERHUB_TOKEN

  # Build the image from Dockerfile.dockerhub
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-f'
      - Dockerfile.dockerhub
      - '-t'
      - 'fswillis99/runpod-comfy-worker:latest'
      - '-t'
      - 'fswillis99/runpod-comfy-worker:$COMMIT_SHA'
      - '.'

  # Push both tags
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'fswillis99/runpod-comfy-worker:latest']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'fswillis99/runpod-comfy-worker:$COMMIT_SHA']

availableSecrets:
  secretManager:
    - versionName: projects/project-b882ddad-b8b1-4a5c-908/secrets/dockerhub-username/versions/latest
      env: DOCKERHUB_USERNAME
    - versionName: projects/project-b882ddad-b8b1-4a5c-908/secrets/dockerhub-token/versions/latest
      env: DOCKERHUB_TOKEN

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 300
  logging: CLOUD_LOGGING_ONLY

timeout: 21600s
