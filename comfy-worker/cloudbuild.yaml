steps:
  # Login to Docker Hub using credentials from Secret Manager
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - echo "$$DOCKERHUB_TOKEN" | docker login -u "$$DOCKERHUB_USERNAME" --password-stdin
    secretEnv:
      - DOCKERHUB_USERNAME
      - DOCKERHUB_TOKEN

  # Generate datetime tag (YYYYMMDD-HHMM) and write to /workspace/tag.txt
  - name: "bash"
    args:
      - "-c"
      - date -u +%Y%m%d-%H%M | tee /workspace/tag.txt

  # Build the image. Model layers are pulled from model-base (no re-download).
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        TAG=$$(cat /workspace/tag.txt)
        docker build \
          -f comfy-worker/Dockerfile \
          -t us-central1-docker.pkg.dev/project-b882ddad-b8b1-4a5c-908/runpod/comfy-worker:latest \
          -t us-central1-docker.pkg.dev/project-b882ddad-b8b1-4a5c-908/runpod/comfy-worker:$${TAG} \
          .

  # Push to Artifact Registry (model blob layers already present — push is fast)
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        TAG=$$(cat /workspace/tag.txt)
        docker push us-central1-docker.pkg.dev/project-b882ddad-b8b1-4a5c-908/runpod/comfy-worker:latest
        docker push us-central1-docker.pkg.dev/project-b882ddad-b8b1-4a5c-908/runpod/comfy-worker:$${TAG}

availableSecrets:
  secretManager:
    - versionName: projects/project-b882ddad-b8b1-4a5c-908/secrets/dockerhub-username/versions/latest
      env: DOCKERHUB_USERNAME
    - versionName: projects/project-b882ddad-b8b1-4a5c-908/secrets/dockerhub-token/versions/latest
      env: DOCKERHUB_TOKEN

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 300
  logging: CLOUD_LOGGING_ONLY

timeout: 21600s
