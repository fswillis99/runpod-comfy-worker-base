steps:
  # Use crane to copy directly between registries — no layer download needed.
  # AR auth is handled automatically via the Cloud Build service account.
  - name: "bash"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
          | tar -xz -C /usr/local/bin crane

        crane auth login index.docker.io -u "$$DOCKERHUB_USERNAME" -p "$$DOCKERHUB_TOKEN"

        crane copy \
          us-central1-docker.pkg.dev/project-b882ddad-b8b1-4a5c-908/runpod/comfy-worker:latest \
          fswillis99/runpod-comfy-worker:latest
    secretEnv:
      - DOCKERHUB_USERNAME
      - DOCKERHUB_TOKEN

availableSecrets:
  secretManager:
    - versionName: projects/project-b882ddad-b8b1-4a5c-908/secrets/dockerhub-username/versions/latest
      env: DOCKERHUB_USERNAME
    - versionName: projects/project-b882ddad-b8b1-4a5c-908/secrets/dockerhub-token/versions/latest
      env: DOCKERHUB_TOKEN

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
